name: Update Doodle Garden
on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/garden.mjs'
      - '.github/workflows/doodle-garden.yml'
permissions:
  contents: write
concurrency:
  group: doodle-garden
  cancel-in-progress: false
jobs:
  garden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate garden from GitHub activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GARDEN_USER: ${{ github.repository_owner }}
        run: node scripts/garden.mjs
      - name: Save the garden
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/doodle-garden.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Update doodle garden'
            git push
          fi
